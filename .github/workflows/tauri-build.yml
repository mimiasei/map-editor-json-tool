name: Build desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required to create GitHub Releases and push README/version updates
permissions:
  contents: write

jobs:
  # ── One release, created once, before any platform builds ────────────────────
  #
  # Previously each of the three matrix jobs called tauri-action with `tagName`
  # and no `releaseId`, so each independently created the release for the tag.
  # GitHub permits several *draft* releases sharing one tag name, and because the
  # jobs start in the same second they raced: v0.6.11 produced two releases with
  # created_at 14:23:26, one holding only the macOS bundles and one holding only
  # the Windows and Linux bundles. Each got its own latest.json listing only its
  # own platforms, so publishing the macOS one left latest.json with nothing but
  # `darwin-aarch64` — and every Windows client asking for an update got
  # "None of the fallback platforms [windows-x86_64-nsis, windows-x86_64] were
  # found in the response platforms object".
  #
  # Creating the release here and passing its id to every build job means there
  # is exactly one release and exactly one latest.json to merge into.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: Create or reuse the draft release
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '')

            // Re-running the workflow for a tag must not add a second release.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existing = releases.filter((r) => r.tag_name === tag)
            if (existing.length > 1) {
              core.setFailed(
                `${existing.length} releases already exist for ${tag} (ids: ${existing
                  .map((r) => r.id)
                  .join(', ')}). Delete the extras before re-running — otherwise the ` +
                  'platforms get split across them and auto-update breaks.',
              )
              return ''
            }
            if (existing.length === 1) {
              core.info(`Reusing existing release ${existing[0].id} for ${tag}`)
              return String(existing[0].id)
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Scenario Script Editor ${tag}`,
              body: [
                'Desktop release for macOS (Apple Silicon), Windows, and Linux.',
                '',
                `See [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/commits/main) for what changed.`,
              ].join('\n'),
              draft: true,
              prerelease: false,
            })
            core.info(`Created release ${data.id} for ${tag}`)
            return String(data.id)

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux system dependencies for WebKitGTK
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: npm ci

      # Build the extract_thumbnails sidecar with PyInstaller.
      #
      # We use the exact --collect-all set verified by ignis-sec/HoMM-OE-Template-Editor
      # to produce a working binary on all platforms. UnityPy lazily imports native
      # texture decoders; PyInstaller's static analysis misses them even with
      # --collect-all UnityPy alone. Without collecting each decoder chain explicitly,
      # UnityPy.load() scans assets fine but every .image decode silently raises and
      # 0 icons are saved.
      #
      #   texture2ddecoder  BC7/DXT decoders
      #   etcpak            ETC/ETC2 decoders
      #   astc_encoder_py   ASTC decoder (astc_encoder has no Python 3.12 release)
      #   archspec          CPU-feature JSON tables read at runtime by astc_encoder_py
      #   fmod_toolkit      native fmod lib; UnityPy asset loader touches audio init
      #                     even for Texture2D-only reads — binary must be present
      #   PIL               PNG encoder for image.save()
      #
      # PyInstaller only targets the host architecture, so each platform runner
      # produces its own binary with the correct target triple suffix.
      - name: Build sidecar binary
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r src-tauri/sidecar/requirements.txt

          if [ -n "${{ matrix.args }}" ]; then
            TRIPLE=$(echo "${{ matrix.args }}" | sed 's/--target //')
          else
            TRIPLE=$(rustc -vV | awk '/^host:/{print $2}')
          fi

          cd src-tauri/sidecar
          pyinstaller --onefile \
            --collect-all UnityPy \
            --collect-all texture2ddecoder \
            --collect-all etcpak \
            --collect-all astc_encoder_py \
            --collect-all archspec \
            --collect-all fmod_toolkit \
            --collect-all PIL \
            --name "extract_thumbnails-${TRIPLE}" \
            extract_thumbnails.py

          if [[ "$TRIPLE" == *"windows"* ]]; then
            mv "dist/extract_thumbnails-${TRIPLE}.exe" "extract_thumbnails-${TRIPLE}.exe"
          else
            mv "dist/extract_thumbnails-${TRIPLE}" "extract_thumbnails-${TRIPLE}"
          fi

      # Sync tauri.conf.json version with the git tag so artifact filenames
      # match the release tag (e.g. tag v0.1.3 → files named 0.1.3_*)
      - name: Sync app version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            cfg.version = '${VERSION}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      # Decide whether this job emits signed updater artifacts.
      #
      # Two reasons to turn them off:
      #
      #  1. Linux. AppImage self-update needs the AppImage to be writable in place
      #     and deb/rpm installs can never self-update, so a Linux update banner
      #     would mostly fail. Omitting the artifacts keeps `linux-x86_64` out of
      #     latest.json, so check() simply returns nothing for Linux clients —
      #     no frontend platform guard needed.
      #
      #  2. No signing key. Updater artifacts MUST be signed; with the secret unset
      #     Tauri aborts the whole bundle step, and the error it prints
      #     ("Missing comment in secret key") does not hint at the real cause. That
      #     used to take the installers down with it — a release that shipped no
      #     .dmg and no .exe purely because OTA was not set up yet. Now the release
      #     still ships, just without auto-update, and a warning says so.
      - name: Configure updater artifacts
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            ENABLE=false
            echo "Linux job — updater artifacts disabled by design."
          elif [ "$HAS_SIGNING_KEY" != "true" ]; then
            ENABLE=false
            echo "::warning title=Auto-update disabled::TAURI_SIGNING_PRIVATE_KEY is not set, so this release ships installers without auto-update support. See the Releasing section of README.md to set up the signing key."
          else
            ENABLE=true
            echo "Signing key present — building signed updater artifacts."
          fi

          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            cfg.bundle.createUpdaterArtifacts = ${ENABLE};
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          "

      # On a version tag: build and upload into the single release created above.
      # Passing releaseId (never tagName) is what keeps this from creating a
      # second release for the tag — see the create-release job.
      - name: Build Tauri app (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. When unset, the "Configure updater
          # artifacts" step above has already disabled them, so the build succeeds
          # and simply ships no OTA support.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # On manual dispatch or branch push: build only, no release
      - name: Build Tauri app (CI check)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

  # ── Gate: refuse to let a half-updatable release look finished ────────────────
  #
  # Even with one shared release, tauri-action assembles latest.json by reading
  # the existing asset, merging its own platforms in, deleting it and re-uploading
  # (src/upload-version-json.ts). That read-modify-write is not atomic, so if the
  # macOS and Windows jobs ever finish uploading at the same moment one can clobber
  # the other's platforms. It has not happened in practice — the two builds finish
  # minutes apart — but the failure is silent and only shows up as a broken update
  # check on whichever platform lost, which is exactly the bug this release hit.
  #
  # So verify the assembled latest.json before the release is published, and fail
  # loudly while it is still a draft.
  verify-updater-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check latest.json covers every updatable platform
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = Number('${{ needs.create-release.outputs.release_id }}')
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              per_page: 100,
            })

            const asset = assets.find((a) => a.name === 'latest.json')
            if (!asset) {
              // Documented degraded mode: no signing key, so no OTA artifacts at all.
              // The installers are still fine, so this is a warning, not a failure.
              core.warning(
                'No latest.json on the release — this build shipped installers without ' +
                  'auto-update support. See the Releasing section of README.md.',
              )
              return
            }

            const raw = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              },
            )
            const platforms = JSON.parse(Buffer.from(raw.data).toString()).platforms ?? {}
            const found = Object.keys(platforms)
            core.info(`latest.json platforms: ${found.join(', ') || '(none)'}`)

            // Linux is intentionally absent — see "Configure updater artifacts".
            const required = ['darwin-aarch64', 'windows-x86_64']
            const missing = required.filter((k) => !(k in platforms))
            if (missing.length) {
              core.setFailed(
                `latest.json is missing ${missing.join(', ')} — clients on those platforms ` +
                  'would fail their update check. The release is still a draft; inspect the ' +
                  'build jobs and re-run before publishing.',
              )
            }

  # After all platform builds succeed, update README and tauri.conf.json on main
  update-readme:
    needs: [build, verify-updater-json]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version and README download links
        shell: bash
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          BASE="https://github.com/${{ github.repository }}/releases/download"

          # Sync tauri.conf.json version
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            cfg.version = '${VERSION}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

          # Update download section header
          sed -i -E "s/Desktop downloads \(v[0-9]+\.[0-9]+\.[0-9]+\)/Desktop downloads (${TAG})/" README.md

          # Update version in all filenames (covers both link text and URLs)
          sed -i -E "s|HommOE\.Scenario\.Editor_[0-9]+\.[0-9]+\.[0-9]+_|HommOE.Scenario.Editor_${VERSION}_|g" README.md

          # Update release tag in download URLs
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/|releases/download/${TAG}/|g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md src-tauri/tauri.conf.json
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ github.ref_name }}"
          git push origin main
