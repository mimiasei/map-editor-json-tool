[package]
name = "app"
version = "0.1.0"
description = "OE Map Editor — desktop app"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
# Desktop only needs rlib. staticlib/cdylib (Tauri's template default) are
# for iOS/Android and each wrote another full copy of the app (~1 GB in debug).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tempfile = "3"
# protocol-asset matches app.security.assetProtocol in tauri.conf.json (serves extracted
# thumbnail PNGs from $APPLOCALDATA via convertFileSrc). Without this feature the build
# script refuses to build at all: "does not match the allowlist defined under tauri.conf.json".
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

# Text writer (Story Builder): HTTPS calls to the user's chosen text service, and the OS
# credential store for their key. Same reqwest version tauri already pulls in.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Pause before retrying when every model is busy; tauri already pulls tokio in.
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["sync-secret-service"]

# Desktop-only: there is no mobile target for the updater.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-cli = "2"

# Debug builds: no debug info for third-party crates (never debugged here) —
# most of target/debug's size. The app's own code keeps full debug info.
[profile.dev.package."*"]
debug = false

# Steam install path lookup for game-folder detection (game_dir.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
