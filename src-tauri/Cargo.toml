[package]
name = "app"
version = "0.1.0"
description = "OE Map Editor — desktop app"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tempfile = "3"
# protocol-asset matches app.security.assetProtocol in tauri.conf.json (serves extracted
# thumbnail PNGs from $APPLOCALDATA via convertFileSrc). Without this feature the build
# script refuses to build at all: "does not match the allowlist defined under tauri.conf.json".
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

# Desktop-only: there is no mobile target for the updater.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
